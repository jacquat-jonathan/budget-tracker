name: Deploy

# Builds the app and uploads dist/ to the Infomaniak web hosting over FTPS (FTP encrypted with
# TLS), with an FTP-only user locked to the site folder. See docs/deployment.md for the one-time
# setup, the first deploy and rollbacks.
#
# Runs by itself once the Main workflow (every check, unsplit) is green for a push to main, and
# by hand from the Actions tab: "Deploy" > "Run workflow". Off until the repository variable
# DEPLOY_WEB is "true" (a manual dry run works without it).
#
# Settings > Secrets and variables > Actions:
#   Variables: DEPLOY_WEB                     true
#              REMOTE_DIR                     /  (the folder as the FTP user sees it)
#              VITE_SUPABASE_URL              https://<ref>.supabase.co
#              VITE_SUPABASE_PUBLISHABLE_KEY  the hosted publishable key (public by design)
#              VITE_BASE_PATH                 /  (or /budget/ for a subfolder)
#   Secrets:   FTP_HOST, FTP_USER, FTP_PASSWORD
on:
  workflow_run:
    workflows: [Main]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to deploy (branch, tag or commit SHA). Empty deploys the branch selected above. Only a commit on main is uploaded; any other is a dry run. An earlier commit of main is the rollback path.
        required: false
        default: ""
      dry_run:
        description: Dry run. Build and list what would be uploaded and deleted on the server; change nothing.
        type: boolean
        default: false
      schema_pushed:
        description: Schema pushed. supabase/migrations/ differs from the live release (or the live release is unknown) and you have checked the hosted project has exactly these migrations (docs/deployment.md, step 10).
        type: boolean
        default: false

permissions:
  contents: read

# Never run two deploys at once; a second one waits instead of cancelling a running upload.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  # The live site: its /version.json says which commit it was built from.
  SITE_URL: https://budget.jacquatjonathan.ch

jobs:
  deploy:
    name: Build and upload to Infomaniak
    # A manual dry run works before DEPLOY_WEB is on: it only reads the server. Main's nightly
    # and manual runs never deploy, only its runs for a push.
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.dry_run) || (
        vars.DEPLOY_WEB == 'true' && (
          github.event_name == 'workflow_dispatch' || (
            github.event.workflow_run.conclusion == 'success' &&
            github.event.workflow_run.event == 'push')))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TARGET_REF: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.ref || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TARGET_REF }}
          # Full history: the commit must be on main, and supabase/migrations/ is compared
          # with the live commit.
          fetch-depth: 0
          persist-credentials: false

      # Fail fast on configuration problems, before installing anything.
      - name: Check configuration
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          REMOTE_DIR: ${{ vars.REMOTE_DIR }}
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          missing=0
          for name in VITE_SUPABASE_URL VITE_SUPABASE_PUBLISHABLE_KEY REMOTE_DIR; do
            if [ -z "${!name}" ]; then
              echo "::error::Repository variable $name is not set (Settings > Secrets and variables > Actions > Variables)."
              missing=1
            fi
          done
          for name in FTP_HOST FTP_USER FTP_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Repository secret $name is not set (Settings > Secrets and variables > Actions > Secrets)."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then exit 1; fi
          # The browser may only talk to origins the CSP in public/.htaccess allows.
          node .github/scripts/check-csp.mjs public/.htaccess "$VITE_SUPABASE_URL"

      # Only a commit on main is uploaded; any other run is a dry run. An automatic run whose
      # commit is no longer main's tip leaves the upload to the run of the newer commit, so an
      # older build never replaces a newer one.
      - name: Decide what this run does
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          DRY_RUN_INPUT: ${{ inputs.dry_run == true }}
        run: |
          sha=$(git rev-parse HEAD)
          dry_run=$DRY_RUN_INPUT
          if ! git merge-base --is-ancestor "$sha" origin/main; then
            echo "::notice::$sha is not on main: dry run only."
            dry_run=true
          fi
          skip=false
          if [ "$EVENT" = workflow_run ] && [ "$sha" != "$(git rev-parse origin/main)" ]; then
            echo "::notice::main has moved on since $sha; the run for the newer commit deploys it."
            skip=true
          fi
          echo "Commit: $sha, dry run: $dry_run, skip: $skip"
          { echo "sha=$sha"; echo "dry_run=$dry_run"; echo "skip=$skip"; } >> "$GITHUB_OUTPUT"

      # The database ships first (D-006): the new app must never run on an old schema. The
      # Deploy workflow holds no database credential, so it compares supabase/migrations/ with
      # the commit that is live now (its /version.json) and stops if they differ, unless the
      # run says the schema was pushed.
      - name: Check migrations against the live release
        if: steps.plan.outputs.skip != 'true'
        env:
          SHA: ${{ steps.plan.outputs.sha }}
          DRY_RUN: ${{ steps.plan.outputs.dry_run }}
          SCHEMA_PUSHED: ${{ inputs.schema_pushed == true }}
        run: |
          live_sha=$(curl -fsS "$SITE_URL/version.json?nocache=$(date +%s)" 2>/dev/null \
            | sed -n 's/.*"commit": *"\([0-9a-f]\{40\}\)".*/\1/p' | head -1 || true)
          problem=""
          if [ -z "$live_sha" ]; then
            problem="$SITE_URL/version.json does not say which commit is live, so its migrations cannot be compared."
          elif ! git cat-file -e "$live_sha^{commit}" 2>/dev/null; then
            problem="the live commit $live_sha is not in this repository's history."
          else
            echo "Live commit: $live_sha"
            changed=$(git diff --name-only "$live_sha" "$SHA" -- supabase/migrations/)
            if [ -n "$changed" ]; then
              problem="supabase/migrations/ differs between the live commit and $SHA: $(printf '%s\n' "$changed" | tr '\n' ' ')"
            fi
          fi
          if [ -z "$problem" ]; then
            echo "No migration changes since the live release."
          elif [ "$SCHEMA_PUSHED" = true ]; then
            echo "::warning::$problem Going ahead: the run says the hosted project has these migrations."
          elif [ "$DRY_RUN" = true ]; then
            echo "::warning::$problem A real deploy stops here until the schema is pushed."
          else
            echo "::error::$problem Push the migrations first (docs/deployment.md, step 10), then run Deploy by hand with \"Schema pushed\" ticked."
            exit 1
          fi

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.plan.outputs.skip != 'true'
        with:
          node-version: 22
          cache: npm

      - if: steps.plan.outputs.skip != 'true'
        run: npm ci

      # The same frontend checks as CI, so a manual run on a broken ref cannot ship it.
      - if: steps.plan.outputs.skip != 'true'
        run: npm run lint
      - if: steps.plan.outputs.skip != 'true'
        run: npm run typecheck
      - if: steps.plan.outputs.skip != 'true'
        run: npm test

      - name: Build
        if: steps.plan.outputs.skip != 'true'
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_BASE_PATH: ${{ vars.VITE_BASE_PATH }}
          SHA: ${{ steps.plan.outputs.sha }}
        run: |
          npm run build
          # Which commit is live: read by the migration check of the next deploy.
          printf '{ "commit": "%s", "built": "%s" }\n' "$SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > dist/version.json

      - name: Check build output
        if: steps.plan.outputs.skip != 'true'
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
        run: |
          test -f dist/index.html || { echo "::error::dist/index.html is missing"; exit 1; }
          test -f dist/.htaccess || { echo "::error::dist/.htaccess is missing"; exit 1; }
          # Check the policy that actually ships.
          node .github/scripts/check-csp.mjs dist/.htaccess "$VITE_SUPABASE_URL"

      - name: Upload over FTPS
        if: steps.plan.outputs.skip != 'true'
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          # lftp reads the password from LFTP_PASSWORD (open --env-password), so it never appears
          # on a command line.
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          REMOTE_DIR: ${{ vars.REMOTE_DIR }}
          DRY_RUN: ${{ steps.plan.outputs.dry_run }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          remote="${REMOTE_DIR%/}/"
          # TLS is required for the login and the file transfers, and the server certificate is
          # verified.
          connect="set ftp:ssl-force true; set ftp:ssl-protect-data true; set ssl:verify-certificate true; \
                   set net:max-retries 2; open --env-password -u '$FTP_USER' 'ftp://$FTP_HOST'"
          # Never deleted on the server, though not in the build: .well-known/ (certificate
          # validation), and the files Infomaniak puts in every site folder: .user.ini (PHP
          # settings) and .infomaniak-maintenance.html.
          keep="-x '^\.well-known/' -x '^\.user\.ini$' -x '^\.infomaniak-maintenance\.html$'"

          m="mirror --reverse --verbose"
          put_index="put dist/index.html -o '${remote}index.html'"
          put_version="put dist/version.json -o '${remote}version.json'"
          if [ "$DRY_RUN" = "true" ]; then
            echo "Dry run: nothing is changed on the server. Commands lftp would run:"
            m="$m --dry-run"
            put_index="echo $put_index"
            put_version="echo $put_version"
          fi

          # Files already on the server are never deleted and re-uploaded, so the live site never
          # misses one:
          # 1. assets/: only new files. Vite puts a content hash in their names, so a name that is
          #    already there has the same content (size is still compared; the time always differs
          #    after a checkout).
          # 2. Other files except index.html and version.json (.htaccess, theme-init.js, favicon…):
          #    written over in place.
          # 3. index.html, which switches visitors to the new assets, then version.json, which
          #    records the release only once it is live.
          # 4. Delete files that are no longer in the build (old hashed assets).
          lftp -c "$connect; set xfer:make-backup no; \
                   $m --parallel=2 --ignore-time dist/assets/ '${remote}assets/'; \
                   $m --overwrite -x '^index\.html$' -x '^version\.json$' -x '^assets/' dist/ '$remote'; \
                   $put_index; \
                   $put_version; \
                   $m --delete --ignore-time $keep dist/ '$remote'"
